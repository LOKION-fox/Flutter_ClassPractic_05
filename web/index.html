<!DOCTYPE html>
<html lang="ru">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">

  <meta
    name="description"
    content="Учебное Flutter Web-приложение «Зоомагазин»"
  >

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="mobile-web-app-capable"
    content="yes"
  >

  <meta
    name="apple-mobile-web-app-status-bar-style"
    content="black"
  >

  <meta
    name="apple-mobile-web-app-title"
    content="Зоомагазин"
  >

  <link
    rel="apple-touch-icon"
    href="icons/Icon-192.png"
  >

  <link
    rel="icon"
    type="image/png"
    href="favicon.png"
  >

  <link
    rel="manifest"
    href="manifest.json"
  >

  <title>Зоомагазин</title>

  <style>
    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      background: #f7f9f8;
      font-family: Arial, sans-serif;
    }

    #app-loading {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f7f9f8;
      color: #173d36;
      transition: opacity 180ms ease;
    }

    #app-loading.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .loading-card {
      width: min(88vw, 360px);
      padding: 32px 24px;
      box-sizing: border-box;
      text-align: center;
    }

    .loading-title {
      margin-bottom: 20px;
      font-size: 28px;
      font-weight: 700;
    }

    .loading-spinner {
      width: 42px;
      height: 42px;
      margin: 0 auto;
      border: 4px solid #c8d8d4;
      border-top-color: #00695c;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    .loading-text {
      margin-top: 18px;
      font-size: 14px;
      color: #4d625d;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }
  </style>
</head>

<body>
  <div
    id="app-loading"
    role="status"
    aria-live="polite"
  >
    <div class="loading-card">
      <div class="loading-title">
        Зоомагазин
      </div>

      <div
        class="loading-spinner"
        aria-hidden="true"
      ></div>

      <div class="loading-text">
        Загрузка приложения…
      </div>
    </div>
  </div>

  <script>
    (function () {
      const splash =
        document.getElementById('app-loading');

      function hideSplash() {
        if (
          !splash ||
          splash.classList.contains('hidden')
        ) {
          return;
        }

        splash.classList.add('hidden');

        window.setTimeout(
          () => splash.remove(),
          220
        );
      }

      window.addEventListener(
        'flutter-first-frame',
        hideSplash,
        { once: true }
      );

      const observer =
        new MutationObserver(() => {
          const flutterView =
            document.querySelector(
              'flutter-view, flt-glass-pane'
            );

          if (flutterView) {
            observer.disconnect();

            window.setTimeout(
              hideSplash,
              600
            );
          }
        });

      observer.observe(
        document.body,
        {
          childList: true,
          subtree: true,
        }
      );
    })();
  </script>

  <script
    src="flutter_bootstrap.js"
    async
  ></script>
</body>
</html>
